<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Rastreio - Zeus Rastreio</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            background-color: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover, select:hover {
            background-color: #475569;
        }
        #status-bar {
            background-color: #1e293b;
            padding: 8px 25px;
            font-size: 0.85rem;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
        }
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Zeus Rastreio - Painel Ao Vivo</h1>
        <div class="controls">
            <select id="deviceSelect" onchange="mudarDispositivo()">
                <option value="Douglasgarcia">Douglasgarcia</option>
            </select>
            <button onclick="carregarLocalizacoes()">Atualizar Agora</button>
        </div>
    </header>

    <div id="status-bar">
        Status: <span id="lastUpdate" style="color: #38bdf8;">Aguardando dados...</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        const API_URL = "https://zeusrastreio.onrender.com";
        let deviceId = "meu_celular";
        
        // Inicializa o mapa centralizado (ajustará automaticamente no primeiro ponto)
        const map = L.map('map').setView([-20.44, -54.64], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker = null;
        let polyline = null;

        async function carregarLocalizacoes() {
            deviceId = document.getElementById("deviceSelect").value;
            const statusEl = document.getElementById("lastUpdate");

            try {
                const response = await fetch(`${API_URL}/locations/${deviceId}`);
                if (!response.ok) {
                    statusEl.innerText = "Nenhum registro encontrado para este dispositivo.";
                    return;
                }

                const data = await response.json();
                if (data.length === 0) return;

                // Extrai coordenadas para a linha do trajeto
                const latLngs = data.map(item => [item.latitude, item.longitude]);
                const ultimaPosicao = data[data.length - 1];

                // Atualiza ou cria o marcador da posição atual
                if (marker) {
                    marker.setLatLng([ultimaPosicao.latitude, ultimaPosicao.longitude]);
                } else {
                    marker = L.marker([ultimaPosicao.latitude, ultimaPosicao.longitude]).addTo(map)
                        .bindPopup(`<b>Dispositivo:</b> ${deviceId}<br><b>Velocidade:</b> ${ultimaPosicao.speed || 0} km/h<br><b>Data/Hora:</b> ${new Date(ultimaPosicao.timestamp).toLocaleString()}`)
                        .openPopup();
                }

                // Centraliza o mapa na última posição conhecida
                map.setView([ultimaPosicao.latitude, ultimaPosicao.longitude], 16);

                // Desenha a linha de trajeto histórico
                if (polyline) {
                    polyline.setLatLngs(latLngs);
                } else {
                    polyline = L.polyline(latLngs, {color: '#38bdf8', weight: 4}).addTo(map);
                }

                statusEl.innerText = `Última atualização: ${new Date(ultimaPosicao.timestamp).toLocaleString()} (Total de pontos: ${data.length})`;

            } catch (error) {
                console.error("Erro ao buscar localizações:", error);
                statusEl.innerText = "Erro ao conectar com a API.";
            }
        }

        function mudarDispositivo() {
            carregarLocalizacoes();
        }

        // Carrega ao iniciar e atualiza automaticamente a cada 30 segundos
        carregarLocalizacoes();
        setInterval(carregarLocalizacoes, 30000);
    </script>
</body>
</html>
