<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Rastreio - Zeus Rastreio</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* Tela de Login */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        .login-box h2 {
            margin-bottom: 20px;
            color: #38bdf8;
            font-size: 1.5rem;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: #0284c7;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        .login-box button:hover {
            background-color: #0369a1;
        }
        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        header {
            background-color: #1e293b;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        select, button {
            background-color: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover, select:hover {
            background-color: #475569;
        }
        #status-bar {
            background-color: #1e293b;
            padding: 8px 25px;
            font-size: 0.85rem;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
        }
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Tela de Login -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>⚡ Zeus Rastreio</h2>
            <input type="password" id="senhaInput" placeholder="Digite a senha de acesso" onkeypress="handleKeyPress(event)">
            <button onclick="fazerLogin()">Entrar no Painel</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>

    <header>
        <h1>⚡ Zeus Rastreio - Painel Frota</h1>
        <div class="controls">
            <select id="deviceSelect" onchange="mudarDispositivo()">
                <option value="Douglasgarcia">Douglasgarcia</option>
            </select>
            <button onclick="carregarLocalizacoes()">Atualizar Agora</button>
        </div>
    </header>

    <div id="status-bar">
        Status: <span id="lastUpdate" style="color: #38bdf8;">Aguardando dados...</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Defina aqui a senha de acesso ao painel
        const SENHA_MESTRE = "zeus123";

        function fazerLogin() {
            const senha = document.getElementById("senhaInput").value;
            const errorEl = document.getElementById("errorMsg");

            if (senha === SENHA_MESTRE) {
                document.getElementById("login-overlay").style.display = "none";
                initApp();
            } else {
                errorEl.innerText = "Senha incorreta. Tente novamente.";
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                fazerLogin();
            }
        }

        const API_URL = "https://zeusrastreio.onrender.com";
        let deviceId = "Douglasgarcia";
        let map, marker, polyline;

        function initApp() {
            // Inicializa o mapa centralizado
            map = L.map('map').setView([-20.44, -54.64], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            carregarDispositivos();
            carregarLocalizacoes();
            setInterval(carregarLocalizacoes, 30000);
        }

        async function carregarDispositivos() {
            try {
                const response = await `${API_URL}/devices`; // Rota opcional caso sua API liste os aparelhos
                // Se a API não tiver essa rota, o select mantém os padrões ou você pode popular dinamicamente
            } catch (e) {
                console.log("Usando lista padrão de dispositivos");
            }
        }

        async function carregarLocalizacoes() {
            deviceId = document.getElementById("deviceSelect").value;
            const statusEl = document.getElementById("lastUpdate");

            try {
                const response = await fetch(`${API_URL}/locations/${deviceId}`);
                if (!response.ok) {
                    statusEl.innerText = "Nenhum registro encontrado para este dispositivo.";
                    return;
                }

                const data = await response.json();
                if (data.length === 0) return;

                const latLngs = data.map(item => [item.latitude, item.longitude]);
                const ultimaPosicao = data[data.length - 1];

                if (marker) {
                    marker.setLatLng([ultimaPosicao.latitude, ultimaPosicao.longitude]);
                    marker.bindPopup(`<b>Dispositivo:</b> ${deviceId}<br><b>Velocidade:</b> ${ultimaPosicao.speed || 0} km/h<br><b>Data/Hora:</b> ${new Date(ultimaPosicao.timestamp).toLocaleString()}`);
                } else {
                    marker = L.marker([ultimaPosicao.latitude, ultimaPosicao.longitude]).addTo(map)
                        .bindPopup(`<b>Dispositivo:</b> ${deviceId}<br><b>Velocidade:</b> ${ultimaPosicao.speed || 0} km/h<br><b>Data/Hora:</b> ${new Date(ultimaPosicao.timestamp).toLocaleString()}`)
                        .openPopup();
                }

                map.setView([ultimaPosicao.latitude, ultimaPosicao.longitude], 16);

                if (polyline) {
                    polyline.setLatLngs(latLngs);
                } else {
                    polyline = L.polyline(latLngs, {color: '#38bdf8', weight: 4}).addTo(map);
                }

                statusEl.innerText = `Última atualização: ${new Date(ultimaPosicao.timestamp).toLocaleString()} (Total de pontos: ${data.length})`;

            } catch (error) {
                console.error("Erro ao buscar localizações:", error);
                statusEl.innerText = "Erro ao conectar com a API.";
            }
        }

        function mudarDispositivo() {
            if(marker) {
                map.removeLayer(marker);
                marker = null;
            }
            if(polyline) {
                map.removeLayer(polyline);
                polyline = null;
            }
            carregarLocalizacoes();
        }
    </script>
</body>
</html>
